<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <!-- <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"

    <title>Frontend Mentor | Calculator app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      body {
        margin: 0px;
        font-size: 32px;
        font-weight: 700;
        background-color: hsl(222, 26%, 31%);
      }
      .box {
        margin: 0 auto;
        padding: 20px;
        width: max-content;
      }
      button {
        border-color: transparent;
        cursor: pointer;
        background-color: hsl(30, 25%, 89%);
        border-radius: 10px;
        box-shadow: 0px 4px hsl(28deg 16% 65%);
        color: hsl(221, 14%, 31%);
        font-size: smaller;
        /* border: antiquewhite ridge 5px; */
        padding: 10px;
      }
      .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 65px;
        /* float: right; */
        /* width: 60px; */
        /* padding-top: 20px; */
        transform: scale(0.8);
      }
      .txt {
        position: absolute;
        left: -57px;
        color: white;
      }
      .themeToggle {
        color: white;
        font-size: large;
        margin: 0;
        position: absolute;
        right: 113px;
        text-transform: uppercase;
        /* font-size: ; */
      }
      .form-check-input {
        width: 4em !important;
        height: 2em !important;
      }
      .form-switch-a {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        position: absolute;
        right: -57px;
        border-radius: 20px;
        cursor: pointer;
        background: hsl(223, 31%, 20%);
        padding: 5px;
        margin-top: 24px;
        width: 18%;
      }

      .form-switch-a input {
        display: block;
        position: absolute;
        bottom: 0;
        opacity: 0;
      }

      /* .form-switch-a input:after {
        background: transparent !important;
      } */
      .dot-check {
        top: 2px;
        bottom: 3px;
        border-radius: 20px;
        height: 20px;
        width: 20px;
        background-color: orange;
        cursor: default;
        opacity: 0;
      }
      /* .new-button:hover  {
        background-color: yellow;
      } */
      .dot-check:after {
        border-radius: 20px;
        position: absolute;
        top: 15px;
        left: 15px;
        height: 11px;
        width: 11px;
        background-color: pink;
      }

      .new-button {
        display: flex;
        position: relative;
        /* margin-bottom: 12px; */
        cursor: pointer;
        font-size: 22px;
        user-select: none;
      }
      .new-button:hover input ~ .dot-check {
        background-color: yellow;
      }

      .new-button input:checked ~ .dot-check {
        background-color: hsl(6, 63%, 50%);
        opacity: 1;
      }
      .numAlign {
        position: absolute;
        top: -29px;
        padding: 4px;
        color: wheat;
        font-size: medium;
      }
      .calcPortion {
        padding-top: 50px;
      }
      .row1 {
        /* display: grid; */
        display: flex;
        margin-bottom: 27px;
        justify-content: center;
      }
      .row1 input {
        background-color: hsl(224, 36%, 15%);
        border-color: transparent;
        border-radius: 5px;
        color: white;
        font-size: 32px;
        height: 80px;
        width: 100%;
        text-align: end;
      }
      .row2 {
        display: grid;
        grid-template-columns: 80px 80px 80px 80px;
        text-align: center;
        padding: 16px;
        width: fit-content;
        border-radius: 5px;
        position: relative;
        gap: 16px;
        justify-content: center;
        margin: 0 auto;
        background-color: hsl(223, 31%, 20%);
      }
      /* .col {
        background-color: hsl(30, 25%, 89%);
        border-radius: 10px;
        box-shadow: 0px 4px hsl(28deg 16% 65%);
        color: hsl(221, 14%, 31%);
        font-size: smaller;
        border: antiquewhite ridge 5px;
        padding: 10px;
      } */
      .item4 {
        /* border-color: hsl(225, 21%, 49%); */
        font-size: large;
        padding-top: 16px;
        background-color: hsl(225, 21%, 49%);
        box-shadow: 0px 4px hsl(224, 28%, 35%);
        color: white;
      }
      .item17 {
        /* border-color: hsl(225, 21%, 49%); */
        grid-column: 1 / 3;
        font-size: large;
        padding-top: 16px;
        background-color: hsl(225, 21%, 49%);
        box-shadow: 0px 4px hsl(224, 28%, 35%);
        color: white;
      }
      .item18 {
        /* border-color: hsl(6, 63%, 50%); */
        grid-column: 3 / 5;
        background-color: hsl(6, 63%, 50%);
        box-shadow: 0px 4px hsl(6, 70%, 34%);
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div> -->
    <div class="box">
      <!--toggle switch-->
      <div class="container">
        <div class="txt">calc</div>
        <div class="form-switch-a" data-toggle="radio" role="group">
          <p class="themeToggle">theme</p>
          <label class="new-button">
            <div class="numAlign">1</div>
            <input type="radio" name="options" id="option1" checked />
            <div class="dot-check"></div>
          </label>
          <label class="new-button">
            <div class="numAlign">2</div>
            <input type="radio" name="options" id="option2" />
            <div class="dot-check"></div>
          </label>
          <label class="new-button">
            <div class="numAlign">3</div>
            <input type="radio" name="options" id="option3" />
            <div class="dot-check"></div>
          </label>
        </div>
      </div>

      <main class="calcPortion">
        <div class="row">
          <div class="row1">
            <input type="number" name="num" id="#" />
          </div>
          <div class="row2">
            <button class="col">7</button>
            <button class="col">8</button>
            <button class="col">9</button>
            <button class="col item4">DEL</button>
            <button class="col">4</button>
            <button class="col">5</button>
            <button class="col">6</button>
            <button class="col">+</button>
            <button class="col">1</button>
            <button class="col">2</button>
            <button class="col">3</button>
            <button class="col">-</button>
            <button class="col">.</button>
            <button class="col">0</button>
            <button class="col">/</button>
            <button class="col">*</button>
            <button class="col item17">RESET</button>
            <button class="col item18">=</button>
          </div>
        </div>
      </main>
    </div>

    <!-- <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script> -->
  </body>
</html>
